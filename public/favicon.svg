<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0f1419"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#e07a1f"/>
      <stop offset="100%" stop-color="#fa9549"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Barras de analítica (crecientes) -->
  <rect x="12" y="38" width="8" height="14" rx="2" fill="url(#bar)"/>
  <rect x="24" y="30" width="8" height="22" rx="2" fill="url(#bar)"/>
  <rect x="36" y="22" width="8" height="30" rx="2" fill="url(#bar)"/>
  <rect x="48" y="14" width="8" height="38" rx="2" fill="url(#bar)"/>

  <!-- Línea de tendencia ascendente -->
  <polyline points="14,40 28,32 40,24 52,16"
            fill="none" stroke="#ffffff" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Puntos en la línea -->
  <circle cx="14" cy="40" r="2.5" fill="#ffffff"/>
  <circle cx="52" cy="16" r="3" fill="#22c55e"/>
</svg>
